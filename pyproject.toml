[tool.poetry]
name = "task"
version = "0.1.0"
description = ""
authors = ["Author <author@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
uvicorn = "^0.23.2"
httpx = "^0.25.0"
fastapi = "^0.115.6"
sqlalchemy = "^2.0.37"
aiosqlite = "^0.20.0"
psycopg = {extras = ["binary"], version = "^3.2.12"}
alembic = "^1.17.1"
redis = "^7.0.1"
dramatiq = "^1.18.0"
pydantic = "^2.12.4"
asyncpg = "^0.30.0"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"


[tool.poetry.group.dev.dependencies]
flake8 = "==7.3.0"
black = "==25.9.0"
isort = "==6.1.0"
mypy = "==1.18.2"
faker = "^19.10.0"
pylint = "^3.3.9"
pylint-pydantic = "^0.3.0"
pytest = "^7.4.2"
pytest-alembic = "^0.10.7"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-env = "^1.0.1"
pytest-httpx = "^0.26.0"
pytest-mock = "^3.11.1"
pytest-mock-server = "^0.3.0"
pytest-xdist = "^3.3.1"
pre-commit = "^4.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 90
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    migrations/       
  | __pycache__
  | \.git
  | \.pytest_cache
  | \.mypy_cache
  | node_modules
  | build
  | lib
  | \.idea
  | \.vscode
  | \.ruff_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [
    "migrations/",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "build",
    "lib",
    ".idea",
    ".vscode",
    ".ruff_cache"
]
