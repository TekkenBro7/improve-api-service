repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
        exclude: |
          migrations/|__pycache__|\.git|\.pytest_cache|\.mypy_cache|node_modules|build|lib|\.idea|\.vscode|\.ruff_cache

      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
        exclude: |
          migrations/|__pycache__|\.git|\.pytest_cache|\.mypy_cache|node_modules|build|lib|\.idea|\.vscode|\.ruff_cache

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
        exclude: |
          migrations/|__pycache__|\.git|\.pytest_cache|\.mypy_cache|node_modules|build|lib|\.idea|\.vscode|\.ruff_cache

      - id: mypy
        name: mypy
        entry: poetry run mypy --config-file=mypy.ini
        language: system
        types: [python]
        exclude: |
          migrations/|__pycache__|\.git|\.pytest_cache|\.mypy_cache|node_modules|build|lib|\.idea|\.vscode|\.ruff_cache
